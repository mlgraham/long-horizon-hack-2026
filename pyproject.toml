[project]
name = "ledger-cli"
version = "0.1.0"
description = "Resumable agent state as dated, falsifiable Markdown that survives a change of host."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
loop = ["anthropic>=1.0"]
bedrock = ["anthropic>=1.0"]
dev = ["pytest>=8"]
video = ["playwright>=1.45", "pypdf>=4"]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ledger", "sponsors", "hosts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
